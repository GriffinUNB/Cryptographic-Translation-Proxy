# =============================================================================
# ML-DSA Root CA Certificate Profile (Pure Post-Quantum)
# =============================================================================
#
# Usage: Root CA (trust anchor) with full quantum resistance
#
# This certificate provides:
#   - Complete protection against quantum computer attacks
#   - No reliance on classical cryptography
#   - NIST security level (Level 2)
#
# Standards: FIPS 204 (ML-DSA), RFC 5280 (X.509)
#
# Security Level: NIST Level 2 (SHA-256 equivalent)
#   ML-DSA-44 is the fastest ML-DSA variant.
#   Equivalent security to AES-256 against quantum attacks.
#
# Quantum Safety: FULLY PROTECTED
#   Pure PQC - no classical algorithms involved.
#   Safe against both classical and quantum computers.
#
# Compatibility Warning:
#   Pure PQC certificates are NOT compatible with existing PKI software.
#   Most applications cannot verify ML-DSA signatures yet.
#   For backward compatibility, use hybrid/catalyst/ profiles instead.
#
# Use Cases:
#   - Future-proof PKI infrastructure
#   - Internal systems with PQC-capable software
#   - Research and testing environments
#
# Examples:
#
#   # Using --var
#   pki ca init --profile ml/root-ca --ca-dir ./root-ca-pqc \
#       --var cn="ACME Root CA PQC"
#
#   # Using --var-file
#   pki ca init --profile ml/root-ca --ca-dir ./root-ca-pqc --var-file ca-vars.yaml
#
# Expected DN: CN=ACME Root CA PQC, O=ACME Corp, C=US
#
# =============================================================================

name: ml/root-ca-l1
description: "Root CA ML-DSA-44 (full post-quantum, NIST security level 2)"

# -----------------------------------------------------------------------------
# Declarative Variables
# -----------------------------------------------------------------------------
variables:
  cn:
    type: string
    required: true
    description: "Common Name - Root CA name"

  organization:
    type: string
    required: false
    default: "ACME Corp"
    description: "Organization name"

  country:
    type: string
    required: false
    default: "US"
    pattern: "^[A-Z]{2}$"
    minLength: 2
    maxLength: 2
    description: "ISO 3166-1 alpha-2 country code"

# -----------------------------------------------------------------------------
# Algorithm
# -----------------------------------------------------------------------------
# ML-DSA-44 (FIPS 204) - Module-Lattice Digital Signature Algorithm
#   - NIST Level 2 security (~128-bit equivalent)
#   - Strongest variant for maximum Root CA protection
#   - Public key: ~1312 bytes, Signature: ~2420 bytes
#
algorithm: ml-dsa-44

# -----------------------------------------------------------------------------
# Validity
# -----------------------------------------------------------------------------
# 20 years for Root CA.
#
validity: 7300d

# -----------------------------------------------------------------------------
# Subject DN (Distinguished Name)
# -----------------------------------------------------------------------------
subject:
  cn: "{{ cn }}"
  o: "{{ organization }}"
  c: "{{ country }}"

# -----------------------------------------------------------------------------
# X.509 Extensions
# -----------------------------------------------------------------------------
extensions:

  # Basic Constraints (RFC 5280 Section 4.2.1.9)
  # ---------------------------------------------------------------------------
  basicConstraints:
    critical: true
    ca: true
    pathLen: 1

  # Key Usage (RFC 5280 Section 4.2.1.3)
  # ---------------------------------------------------------------------------
  keyUsage:
    critical: true
    values:
      - keyCertSign
      - cRLSign

  # Certificate Policies (RFC 5280 Section 4.2.1.4)
  # ---------------------------------------------------------------------------
  certificatePolicies:
    critical: false
    policies:
      - oid: "2.5.29.32.0"
        cps: "https://pki.acme.example.com/cps"
        userNotice: "ACME Corp Root CA - Post-Quantum (ML-DSA-44)"

# -----------------------------------------------------------------------------
# Signature Algorithm (how this certificate is signed)
# -----------------------------------------------------------------------------
# ML-DSA signatures are intrinsic to the algorithm (no override needed)
