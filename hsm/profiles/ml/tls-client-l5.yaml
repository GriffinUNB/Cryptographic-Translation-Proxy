name: ml/tls-client-l5
description: "TLS client ML-DSA-87"
variables:
  cn: {type: string, required: true}
  email: {type: string, required: false}
  organization: {type: string, required: false, default: "ACME Corp"}
  country: {type: string, required: false, default: "US"}
algorithm: ml-dsa-87
validity: 365d
subject:
  cn: "{{ cn }}"
  o: "{{ organization }}"
  ou: "Users"
  c: "{{ country }}"
extensions:
  basicConstraints: {critical: true, ca: false}
  keyUsage:
    critical: true
    values: [digitalSignature]
  extKeyUsage:
    critical: false
    values: [clientAuth]
  subjectAltName:
    critical: false
    email: "{{ email }}"
